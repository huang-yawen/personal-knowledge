# nginx 站点：把 knowledge.example.com 换成你的域名。
# 证书先用 certbot certonly --webroot -w /var/www/certbot -d knowledge.example.com 申请。
# 安全响应头放在 snippets 里，各 location 分别 include（location 里写了 add_header 就不会继承 server 级的）：
#   /etc/nginx/snippets/pk-security-headers.conf 内容见本文件末尾注释
server {
    listen 80;
    listen [::]:80;
    server_name knowledge.example.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;   # nginx 1.25.1+ 可改为 listen 443 ssl; 加 http2 on;
    listen [::]:443 ssl;
    server_name knowledge.example.com;

    ssl_certificate     /etc/letsencrypt/live/knowledge.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/knowledge.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/personal-knowledge/dist;
    index index.html;
    client_max_body_size 30m;

    location /api/ {
        include snippets/pk-security-headers.conf;
        proxy_pass http://127.0.0.1:3001;
        # 后端的同源校验依赖 Host，必须原样传递；Cookie 的 Secure 依赖 X-Forwarded-Proto
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # 流式回答（SSE）不能被缓冲
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        include snippets/pk-security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        include snippets/pk-security-headers.conf;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}

# pk-security-headers.conf：
